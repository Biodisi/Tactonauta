<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Segmentador de Gráficas</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
    background: #fafafa;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 20px;
    margin-top: 20px;
  }
  #dropzone {
    border: 2px dashed #aaa;
    border-radius: 10px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    color: #555;
    transition: border-color 0.2s, background 0.2s;
  }
  #dropzone.drag { border-color: #4a7dff; background: #eef3ff; }
  #dropzone input { display: none; }
  #preview { max-width: 100%; margin-top: 14px; border-radius: 8px; display: none; }
  button {
    background: #4a7dff;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    margin-top: 14px;
  }
  button:disabled { background: #aac0ff; cursor: not-allowed; }
  #estado { margin-top: 10px; font-size: 14px; color: #555; }
  #resultado { display: none; }
  .fila { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  .fila span:first-child { color: #666; }
  .ok { color: #1a8f4a; font-weight: 600; }
  .no { color: #c0392b; font-weight: 600; }
  a.descarga {
    display: inline-block;
    margin-top: 14px;
    margin-right: 10px;
    background: #1a8f4a;
    color: white;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
  }
  a.descarga.overlay { background: #555; }
  #overlayImg { max-width: 100%; margin-top: 14px; border-radius: 8px; display: none; }
  #error { color: #c0392b; margin-top: 10px; font-size: 14px; display: none; }
  #apiUrl { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>

  <h1>Segmentador de Gráficas</h1>
  <p class="sub">Sube una imagen de una gráfica y obtén los ejes, la curva y el CSV con las coordenadas.</p>

  <div class="card">
    <label style="font-size:13px;color:#666;">URL de la API (déjalo así si corres el servidor en tu misma máquina):</label>
    <input id="apiUrl" type="text" value="http://127.0.0.1:5000">

    <div id="dropzone" style="margin-top:14px;">
      <div id="dzTexto">📁 Arrastra una imagen aquí o haz clic para elegirla</div>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/bmp,image/tiff">
      <img id="preview">
    </div>

    <button id="btnProcesar" disabled>Procesar imagen</button>
    <div id="estado"></div>
    <div id="error"></div>
  </div>

  <div class="card" id="resultado">
    <h3>Resultado</h3>
    <div id="resumenBox"></div>
    <div>
      <a class="descarga" id="linkCsv" href="#" target="_blank">⬇ Descargar CSV</a>
      <a class="descarga overlay" id="linkOverlay" href="#" target="_blank">Ver overlay</a>
    </div>
    <img id="overlayImg">
  </div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const btnProcesar = document.getElementById('btnProcesar');
  const estado = document.getElementById('estado');
  const errorBox = document.getElementById('error');
  const resultadoBox = document.getElementById('resultado');
  const resumenBox = document.getElementById('resumenBox');
  const linkCsv = document.getElementById('linkCsv');
  const linkOverlay = document.getElementById('linkOverlay');
  const overlayImg = document.getElementById('overlayImg');
  const apiUrlInput = document.getElementById('apiUrl');

  let archivoActual = null;

  dropzone.addEventListener('click', () => fileInput.click());

  dropzone.addEventListener('dragover', e => {
    e.preventDefault();
    dropzone.classList.add('drag');
  });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) manejarArchivo(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) manejarArchivo(fileInput.files[0]);
  });

  function manejarArchivo(archivo) {
    archivoActual = archivo;
    preview.src = URL.createObjectURL(archivo);
    preview.style.display = 'block';
    document.getElementById('dzTexto').textContent = archivo.name;
    btnProcesar.disabled = false;
    resultadoBox.style.display = 'none';
    errorBox.style.display = 'none';
  }

  btnProcesar.addEventListener('click', async () => {
    if (!archivoActual) return;
    const base = apiUrlInput.value.trim().replace(/\/$/, '');

    btnProcesar.disabled = true;
    estado.textContent = 'Procesando... esto puede tardar unos segundos.';
    errorBox.style.display = 'none';
    resultadoBox.style.display = 'none';

    const formData = new FormData();
    formData.append('imagen', archivoActual);

    try {
      const resp = await fetch(base + '/api/procesar', {
        method: 'POST',
        body: formData,
      });
      const data = await resp.json();

      if (!data.ok) {
        throw new Error(data.error || 'Error desconocido del servidor.');
      }

      mostrarResultado(data, base);
      estado.textContent = '';
    } catch (err) {
      errorBox.textContent = '⚠ ' + err.message + ' (¿está corriendo el servidor en ' + base + '? ¿permitiste CORS/imagen válida?)';
      errorBox.style.display = 'block';
      estado.textContent = '';
    } finally {
      btnProcesar.disabled = false;
    }
  });

  function filaBool(etiqueta, valor) {
    return `<div class="fila"><span>${etiqueta}</span><span class="${valor ? 'ok' : 'no'}">${valor ? 'Sí ✅' : 'No ❌'}</span></div>`;
  }
  function filaTexto(etiqueta, valor) {
    return `<div class="fila"><span>${etiqueta}</span><span>${valor}</span></div>`;
  }

  function mostrarResultado(data, base) {
    const r = data.resumen;
    resumenBox.innerHTML =
      filaTexto('Título detectado', r.titulo || '(sin título)') +
      filaTexto('Título eje X', r.titulo_eje_x || '(sin detectar)') +
      filaTexto('Título eje Y', r.titulo_eje_y || '(sin detectar)') +
      filaBool('Eje X detectado', r.eje_x_detectado) +
      filaBool('Eje Y detectado', r.eje_y_detectado) +
      filaBool('Curva detectada', r.curva_detectada) +
      filaTexto('Puntos de la curva', r.n_puntos_curva) +
      filaTexto('Etiquetas numéricas eje X', r.n_etiquetas_x) +
      filaTexto('Etiquetas numéricas eje Y', r.n_etiquetas_y) +
      filaBool('Calibración eje X (píxel→valor)', r.calibrado_x) +
      filaBool('Calibración eje Y (píxel→valor)', r.calibrado_y);

    linkCsv.href = base + data.csv_download_url;
    linkOverlay.href = base + data.overlay_url;
    overlayImg.src = base + data.overlay_url;
    overlayImg.style.display = 'block';

    resultadoBox.style.display = 'block';
  }
</script>

</body>
</html>
